  <style>
    /* Critical path CSS - ultra-minimal for fast parsing */
    :root {
      --loader-bg: #0a0a0a;
      --loader-primary: #d12720;
      --loader-accent: #F6B7CF;
    }
    
    /* Base reset - minimal */
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;padding:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
    
    #root { 
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--loader-bg);
    }
    
    /* Initial loader - optimized for minimal CLS */
    .initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: var(--loader-bg);
      z-index: 9999;
    }
    
    .initial-loader-spinner {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--loader-primary) 0%, var(--loader-accent) 100%);
      animation: loader-pulse 1.2s ease-in-out infinite;
      will-change: transform, opacity;
    }
    
    .initial-loader-text {
      color: rgba(255,255,255,0.5);
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: 0.01em;
    }
    
    /* Optimized keyframes - GPU accelerated */
    @keyframes loader-pulse {
      0%, 100% { opacity: 0.5; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1); }
    }
    
    /* Accessibility: respect motion preferences */
    @media (prefers-reduced-motion: reduce) {
      .initial-loader-spinner { 
        animation: none; 
        opacity: 0.7; 
      }
    }
    
    /* Hide content until React mounts */
    .app-loading .initial-loader { display: flex; }
    .app-ready .initial-loader { display: none; }
  </style>
</head>


  <body>
    <div id="root">
      <!-- Initial loader shown while JS loads -->
      <div class="initial-loader" id="initial-loader" aria-label="Cargando aplicación" role="status">
        <div class="initial-loader-spinner" aria-hidden="true"></div>
        <span class="initial-loader-text">Cargando...</span>
      </div>
    </div>
    
    <!-- Main bundle with async loading -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Performance optimization scripts -->
    <script>
      // Track initial load performance
      if ('performance' in window) {
        window.__PERF_START__ = performance.now();
      }
      
      // Remove initial loader with smooth transition
      function removeLoader() {
        var loader = document.getElementById('initial-loader');
        if (!loader) return;
        
        // Use requestAnimationFrame for smooth removal
        requestAnimationFrame(function() {
          loader.style.transition = 'opacity 0.15s ease-out';
          loader.style.opacity = '0';
          
          setTimeout(function() {
            if (loader.parentNode) {
              loader.remove();
            }
            // Log performance if available
            if (window.__PERF_START__ && 'performance' in window) {
              var loadTime = Math.round(performance.now() - window.__PERF_START__);
              if (loadTime > 3000) {
                console.warn('[Performance] Slow initial load:', loadTime + 'ms');
              }
            }
          }, 150);
        });
      }
      
      // Remove loader when React takes over or after timeout
      var loaderRemoved = false;
      function safeRemoveLoader() {
        if (loaderRemoved) return;
        loaderRemoved = true;
        removeLoader();
      }
      
      // Multiple fallbacks to ensure loader is removed
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(safeRemoveLoader, 50);
      });
      
      // Fallback timeout in case React doesn't load
      setTimeout(function() {
        if (!loaderRemoved) {
          console.warn('[Loader] Fallback timeout triggered');
          safeRemoveLoader();
        }
      }, 8000);
      
      // Detect slow connection and adjust expectations
      if ('connection' in navigator) {
        var conn = navigator.connection;
        if (conn && (conn.effectiveType === '2g' || conn.effectiveType === 'slow-2g')) {
          var text = document.querySelector('.initial-loader-text');
          if (text) text.textContent = 'Cargando (conexión lenta)...';
        }
      }
    </script>
